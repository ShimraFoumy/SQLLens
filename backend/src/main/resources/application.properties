spring.application.name=sqllens-backend
server.port=8080

# PostgreSQL DataSource Configuration (overridable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sqllens}
spring.datasource.username=${DB_USER:sqlens_readonly}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# SQLLens Application Specific Configuration
sqllens.query.timeout-seconds=5
sqllens.query.max-rows=500
sqllens.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:80

# Logging
logging.level.com.sqlens=INFO
logging.level.org.springframework.jdbc=INFO
